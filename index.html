<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>云端记账本 - 登录注册</title>
    
    <!-- PWA和图标配置 -->
    <link rel="icon" type="image/png" href="./icons/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="./icons/favicon.svg">
    <link rel="shortcut icon" href="./icons/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
    <meta name="theme-color" content="#4ECDC4">
    <link rel="manifest" href="./manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="云端记账本">
    <meta name="msapplication-TileColor" content="#4ECDC4">
    
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* 极简风格主题色 - 柔和蓝绿配色 */
        :root {
            --primary: #4ECDC4;      /* 柔和青色 */
            --primary-light: #7EE9E0;
            --primary-dark: #2EB3AA;
            --accent: #FF6B6B;       /* 柔和红色 */
            --accent-light: #FF9E9E;
            --success: #6BCF7F;      /* 柔和绿色 */
            --warning: #FFD166;      /* 柔和黄色 */
            --danger: #FF6B6B;       /* 红色 */
            --text-primary: #2D3436;  /* 深灰 */
            --text-secondary: #636E72;
            --text-light: #B2BEC3;
            --light-bg: #F8F9FA;      /* 浅灰背景 */
            --card-bg: #FFFFFF;
            --card-border: #E9ECEF;
            --input-bg: #FFFFFF;
            --input-border: #DFE6E9;
            --radius: 20px;           /* 增加圆角 */
            --radius-lg: 28px;
            --radius-xl: 36px;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.12);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dark-theme {
            --primary: #4ECDC4;
            --primary-light: #7EE9E0;
            --primary-dark: #2EB3AA;
            --light-bg: #121212;
            --card-bg: #1E1E1E;
            --card-border: #333333;
            --input-bg: #2D2D2D;
            --input-border: #404040;
            --text-primary: #F5F5F5;
            --text-secondary: #AAAAAA;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #F8F9FA 0%, #E9ECEF 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: var(--transition);
        }

        .dark-theme body {
            background: linear-gradient(135deg, #121212 0%, #1E1E1E 100%);
        }

        .login-container {
            width: 100%;
            max-width: 460px;
            margin: 0 auto;
        }

        .login-card {
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            padding: 48px 40px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--card-border);
            animation: slideIn 0.6s ease-out;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            border-radius: var(--radius-xl) var(--radius-xl) 0 0;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo {
            text-align: center;
            margin-bottom: 40px;
        }

        .logo-icon {
            width: 84px;
            height: 84px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-radius: 24px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 12px 28px rgba(78, 205, 196, 0.25);
        }

        .logo-icon i {
            font-size: 38px;
            color: white;
        }

        .logo h1 {
            font-size: 32px;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .logo p {
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 400;
        }

        /* 标签切换 */
        .tab-switcher {
            display: flex;
            background: var(--light-bg);
            border-radius: var(--radius);
            padding: 6px;
            margin-bottom: 32px;
            border: 1px solid var(--card-border);
        }

        .tab-btn {
            flex: 1;
            padding: 16px 20px;
            border: none;
            background: none;
            color: var(--text-secondary);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border-radius: calc(var(--radius) - 4px);
            transition: var(--transition);
            position: relative;
            overflow: hidden;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 16px rgba(78, 205, 196, 0.25);
            transform: translateY(-2px);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 表单样式 */
        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            margin-bottom: 10px;
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.5px;
        }

        .form-label i {
            color: var(--primary);
        }

        .form-input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid var(--input-border);
            border-radius: var(--radius);
            font-size: 16px;
            color: var(--text-primary);
            background: var(--input-bg);
            transition: var(--transition);
            font-family: inherit;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(78, 205, 196, 0.15);
        }

        .form-input::placeholder {
            color: var(--text-light);
            opacity: 0.8;
        }

        /* 下拉菜单 - 确保文字可见 */
        select.form-input {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            background: var(--input-bg) url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234ECDC4' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e") no-repeat right 20px center/16px;
            padding-right: 50px;
            color: var(--text-primary) !important;
            border-radius: var(--radius); /* 圆润边框 */
            border: 2px solid var(--input-border);
        }

        select.form-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(78, 205, 196, 0.15);
        }

        select.form-input option {
            background: var(--input-bg);
            color: var(--text-primary);
            padding: 12px;
            border-radius: 12px;
        }

        /* 按钮样式 */
        .btn-primary, .btn-secondary {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: var(--radius);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            box-shadow: 0 4px 16px rgba(78, 205, 196, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 28px rgba(78, 205, 196, 0.4);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            margin-top: 16px;
        }

        .btn-secondary:hover {
            background: rgba(78, 205, 196, 0.05);
            transform: translateY(-2px);
        }

        /* 消息提示 */
        .message {
            padding: 16px;
            border-radius: var(--radius);
            margin-bottom: 24px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideDown 0.3s ease;
            border: 1px solid transparent;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.success {
            background: rgba(107, 207, 127, 0.1);
            color: var(--success);
            border-color: rgba(107, 207, 127, 0.2);
        }

        .message.error {
            background: rgba(255, 107, 107, 0.1);
            color: var(--danger);
            border-color: rgba(255, 107, 107, 0.2);
        }

        .message.warning {
            background: rgba(255, 209, 102, 0.1);
            color: var(--warning);
            border-color: rgba(255, 209, 102, 0.2);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 32px 0;
            color: var(--text-secondary);
            font-size: 13px;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(78, 205, 196, 0.2), transparent);
        }

        .divider span {
            padding: 0 16px;
            background: var(--card-bg);
        }

        /* 功能特性 */
        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-top: 40px;
            padding-top: 32px;
            border-top: 1px solid rgba(78, 205, 196, 0.1);
        }

        .feature {
            text-align: center;
            padding: 20px 16px;
            background: linear-gradient(135deg, rgba(78, 205, 196, 0.05), rgba(255, 107, 107, 0.05));
            border-radius: var(--radius);
            border: 1px solid rgba(78, 205, 196, 0.1);
            transition: var(--transition);
        }

        .feature:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(78, 205, 196, 0.15);
            border-color: rgba(78, 205, 196, 0.2);
        }

        .feature i {
            font-size: 24px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            display: block;
        }

        .feature h4 {
            font-size: 15px;
            color: var(--text-primary);
            margin-bottom: 6px;
            font-weight: 600;
        }

        .feature p {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        /* 主题切换 */
        .theme-toggle {
            position: fixed;
            top: 24px;
            right: 24px;
            z-index: 1000;
        }

        .theme-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border: none;
            color: white;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 16px rgba(78, 205, 196, 0.3);
        }

        .theme-btn:hover {
            transform: rotate(15deg) scale(1.1);
            box-shadow: 0 8px 28px rgba(78, 205, 196, 0.4);
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 40px 24px;
            }
            
            .logo-icon {
                width: 72px;
                height: 72px;
            }
            
            .logo h1 {
                font-size: 28px;
            }
            
            .features {
                grid-template-columns: 1fr;
            }
            
            .theme-btn {
                width: 44px;
                height: 44px;
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="logo">
                <div class="logo-icon">
                    <i class="fas fa-chart-pie"></i>
                </div>
                <h1>云端记账本</h1>
                <p>极简风格 · 实时同步 · 数据安全</p>
            </div>

            <!-- 标签切换 -->
            <div class="tab-switcher">
                <button class="tab-btn active" onclick="switchTab('login')">登录</button>
                <button class="tab-btn" onclick="switchTab('register')">注册</button>
            </div>

            <!-- 登录标签 -->
            <div id="login-tab" class="tab-content active">
                <div id="login-message"></div>
                
                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-user"></i>
                        用户名
                    </label>
                    <input type="text" class="form-input" id="login-username" placeholder="请输入用户名" autocomplete="username">
                </div>
                
                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-lock"></i>
                        密码
                    </label>
                    <input type="password" class="form-input" id="login-password" placeholder="请输入密码" autocomplete="current-password">
                </div>
                
                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-key"></i>
                        GitHub Token
                    </label>
                    <input type="password" class="form-input" id="login-token" placeholder="输入GitHub Personal Access Token" autocomplete="off">
                    <small style="display: block; margin-top: 8px; color: var(--text-secondary); font-size: 12px; line-height: 1.4;">
                        需要 repo 权限。Token将自动保存，下次登录只需输入账号密码。
                    </small>
                </div>
                
                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-database"></i>
                        GitHub仓库
                    </label>
                    <input type="text" class="form-input" id="login-repo" placeholder="用户名/仓库名" value="cailusorz/account-book">
                </div>
                
                <button class="btn-primary" onclick="login()">
                    <i class="fas fa-sign-in-alt"></i>
                    登录
                </button>
            </div>

            <!-- 注册标签 -->
            <div id="register-tab" class="tab-content">
                <div id="register-message"></div>
                
                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-key"></i>
                        GitHub Token
                    </label>
                    <input type="password" class="form-input" id="register-token" placeholder="输入GitHub Personal Access Token" autocomplete="off">
                    <small style="display: block; margin-top: 8px; color: var(--text-secondary); font-size: 12px; line-height: 1.4;">
                        需要 repo 权限，用于创建您的数据文件。
                    </small>
                </div>
                
                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-database"></i>
                        GitHub仓库
                    </label>
                    <input type="text" class="form-input" id="register-repo" placeholder="用户名/仓库名" value="cailusorz/account-book">
                    <small style="display: block; margin-top: 8px; color: var(--text-secondary); font-size: 12px; line-height: 1.4;">
                        请确保仓库已存在且您有写入权限。
                    </small>
                </div>
                
                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-user"></i>
                        用户名
                    </label>
                    <input type="text" class="form-input" id="register-username" placeholder="设置您的用户名（仅字母数字）" pattern="[A-Za-z0-9]+">
                    <small style="display: block; margin-top: 8px; color: var(--text-secondary); font-size: 12px;">
                        请使用字母和数字，不要包含空格或特殊字符
                    </small>
                </div>
                
                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-lock"></i>
                        密码
                    </label>
                    <input type="password" class="form-input" id="register-password" placeholder="设置密码（至少6位）" minlength="6">
                </div>
                
                <div class="form-group">
                    <label class="form-label">
                        <i class="fas fa-lock"></i>
                        确认密码
                    </label>
                    <input type="password" class="form-input" id="register-confirm" placeholder="再次输入密码">
                </div>
                
                <button class="btn-primary" onclick="register()">
                    <i class="fas fa-user-plus"></i>
                    注册新账号
                </button>
            </div>

            <div class="features">
                <div class="feature">
                    <i class="fas fa-sync-alt"></i>
                    <h4>实时同步</h4>
                    <p>多设备数据实时同步</p>
                </div>
                <div class="feature">
                    <i class="fas fa-paint-brush"></i>
                    <h4>极简风格</h4>
                    <p>舒适视觉体验</p>
                </div>
                <div class="feature">
                    <i class="fas fa-chart-line"></i>
                    <h4>智能分析</h4>
                    <p>可视化数据报表</p>
                </div>
                <div class="feature">
                    <i class="fas fa-shield-alt"></i>
                    <h4>数据安全</h4>
                    <p>加密云端存储</p>
                </div>
            </div>
        </div>
    </div>

    <div class="theme-toggle">
        <button class="theme-btn" onclick="toggleTheme()">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <script>
        // 全局配置
        const DEFAULT_REPO = 'cailusorz/account-book';
        let currentTab = 'login';
        
        // 页面加载
        document.addEventListener('DOMContentLoaded', function() {
            // 初始化主题
            initTheme();
            
            // 自动填充已保存的账号和Token
            autoFillLogin();
            
            // 设置默认仓库
            document.getElementById('register-repo').value = DEFAULT_REPO;
            document.getElementById('login-repo').value = DEFAULT_REPO;
            
            // 注册Service Worker（PWA功能）
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('./service-worker.js')
                    .then(function(registration) {
                        console.log('Service Worker 注册成功:', registration.scope);
                    })
                    .catch(function(error) {
                        console.log('Service Worker 注册失败:', error);
                    });
            }
        });
        
        // 初始化主题
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-theme');
                document.querySelector('.theme-btn i').className = 'fas fa-sun';
            } else if (savedTheme === 'auto') {
                if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.body.classList.add('dark-theme');
                    document.querySelector('.theme-btn i').className = 'fas fa-sun';
                }
            }
        }
        
        // 自动填充已保存的登录信息
        function autoFillLogin() {
            try {
                const config = localStorage.getItem('accountConfig');
                if (config) {
                    const parsed = JSON.parse(config);
                    if (parsed.username) {
                        document.getElementById('login-username').value = parsed.username || '';
                    }
                    if (parsed.repo) {
                        document.getElementById('login-repo').value = parsed.repo || DEFAULT_REPO;
                    }
                    // 自动填充已保存的Token（如果有）
                    if (parsed.token) {
                        document.getElementById('login-token').value = parsed.token;
                    }
                }
            } catch (e) {
                console.log('自动填充失败:', e);
            }
        }
        
        // 切换标签页
        function switchTab(tab) {
            currentTab = tab;
            
            // 更新按钮状态
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn')[tab === 'login' ? 0 : 1].classList.add('active');
            
            // 显示对应内容
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.getElementById(`${tab}-tab`).classList.add('active');
            
            // 清空消息
            clearMessages();
        }
        
        // 清空消息
        function clearMessages() {
            document.getElementById('login-message').innerHTML = '';
            document.getElementById('register-message').innerHTML = '';
        }
        
        // 显示消息
        function showMessage(containerId, type, text) {
            const container = document.getElementById(containerId);
            container.innerHTML = `
                <div class="message ${type}">
                    <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'warning' ? 'exclamation-triangle' : 'exclamation-circle'}"></i>
                    ${text}
                </div>
            `;
        }
        
        // 切换主题
        function toggleTheme() {
            const isDark = document.body.classList.toggle('dark-theme');
            const icon = document.querySelector('.theme-btn i');
            icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }
        
        // 登录函数 - 自动保存Token并识别管理员
        async function login() {
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            const token = document.getElementById('login-token').value.trim();
            const repo = document.getElementById('login-repo').value.trim();
            
            // 验证输入
            if (!username || !password || !token) {
                showMessage('login-message', 'error', '请输入用户名、密码和GitHub Token');
                return;
            }
            
            if (!repo || !repo.includes('/')) {
                showMessage('login-message', 'error', '请输入正确的GitHub仓库名');
                return;
            }
            
            // 显示加载状态
            const btn = document.querySelector('#login-tab .btn-primary');
            const original = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 验证中...';
            btn.disabled = true;
            
            try {
                // 验证用户账号是否存在
                const userCheck = await checkUserExistsWithToken(repo, username, password, token);
                
                if (!userCheck.exists) {
                    if (userCheck.reason === 'not_found') {
                        showMessage('login-message', 'error', '账号不存在，请先注册');
                    } else if (userCheck.reason === 'password') {
                        showMessage('login-message', 'error', '密码错误，请重新输入');
                    } else {
                        showMessage('login-message', 'error', '验证失败：' + userCheck.error);
                    }
                    return;
                }
                
                // 获取用户配置（包含管理员标志）
                const userConfig = await getUserConfig(token, repo, username);
                const isAdmin = userConfig && userConfig.isAdmin === true;
                
                // 保存配置到本地（包含Token，下次自动填充）
                const config = {
                    username: username,
                    repo: repo,
                    autoLogin: true,
                    lastLogin: new Date().toISOString(),
                    token: token,
                    isAdmin: isAdmin  // 保存管理员标志
                };
                
                localStorage.setItem('accountConfig', JSON.stringify(config));
                
                showMessage('login-message', 'success', '登录成功！正在跳转...');
                
                // 判断是否为管理员（用户名admin或配置中isAdmin为true）
                setTimeout(() => {
                    if (username === 'admin' || isAdmin) {
                        window.location.href = './admin.html';
                    } else {
                        window.location.href = './app.html';
                    }
                }, 1500);
                
            } catch (error) {
                showMessage('login-message', 'error', error.message || '登录失败，请检查网络连接');
                console.error('登录失败:', error);
            } finally {
                btn.innerHTML = original;
                btn.disabled = false;
            }
        }
        
        // 注册函数（修复管理员自动识别）
        async function register() {
            const token = document.getElementById('register-token').value.trim();
            const repo = document.getElementById('register-repo').value.trim();
            const username = document.getElementById('register-username').value.trim();
            const password = document.getElementById('register-password').value;
            const confirmPassword = document.getElementById('register-confirm').value;
            
            // 验证输入
            if (!token || !repo || !username || !password || !confirmPassword) {
                showMessage('register-message', 'error', '请填写所有字段');
                return;
            }
            
            if (!repo.includes('/')) {
                showMessage('register-message', 'error', '请输入正确的GitHub仓库名');
                return;
            }
            
            // 用户名验证：只允许字母数字
            if (!/^[A-Za-z0-9]+$/.test(username)) {
                showMessage('register-message', 'error', '用户名只能包含字母和数字');
                return;
            }
            
            if (password.length < 6) {
                showMessage('register-message', 'error', '密码至少需要6位');
                return;
            }
            
            if (password !== confirmPassword) {
                showMessage('register-message', 'error', '两次输入的密码不一致');
                return;
            }
            
            // 判断是否为管理员：如果用户名为admin，则自动设为管理员
            const isAdmin = (username === 'admin');
            
            // 显示加载状态
            const btn = document.querySelector('#register-tab .btn-primary');
            const original = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 注册中...';
            btn.disabled = true;
            
            try {
                // 验证GitHub Token和仓库
                showMessage('register-message', 'warning', '正在验证GitHub Token和仓库权限...');
                
                const isValid = await validateGitHubToken(token, repo);
                if (!isValid) {
                    throw new Error('GitHub Token无效或没有仓库写入权限');
                }
                
                // 检查用户名是否已存在
                showMessage('register-message', 'warning', '检查用户名是否可用...');
                const existingUser = await getUserConfig(token, repo, username);
                if (existingUser) {
                    throw new Error('用户名已存在，请选择其他用户名');
                }
                
                // 创建用户配置
                showMessage('register-message', 'warning', '创建用户配置...');
                const userConfig = {
                    username: username,
                    password: btoa(encodeURIComponent(password)),
                    createdAt: new Date().toISOString(),
                    lastLogin: new Date().toISOString(),
                    isAdmin: isAdmin // 根据用户名设置管理员标志
                };
                
                // 保存用户配置到GitHub
                showMessage('register-message', 'warning', '保存用户配置到云端...');
                const success = await saveUserConfig(token, repo, username, userConfig);
                
                if (success) {
                    showMessage('register-message', 'success', '用户配置创建成功！正在创建数据文件...');
                    
                    // 创建初始数据文件
                    setTimeout(async () => {
                        try {
                            const dataCreated = await createInitialData(token, repo, username);
                            if (dataCreated) {
                                showMessage('register-message', 'success', '数据文件创建成功！正在完成注册...');
                                
                                // 保存配置到本地并自动登录
                                setTimeout(() => {
                                    const config = {
                                        username: username,
                                        repo: repo,
                                        token: token,
                                        autoLogin: true,
                                        lastLogin: new Date().toISOString(),
                                        isAdmin: isAdmin // 保存管理员标志
                                    };
                                    
                                    localStorage.setItem('accountConfig', JSON.stringify(config));
                                    showMessage('register-message', 'success', '注册完成！正在跳转...');
                                    
                                    setTimeout(() => {
                                        // 根据isAdmin跳转
                                        if (isAdmin) {
                                            window.location.href = './admin.html';
                                        } else {
                                            window.location.href = './app.html';
                                        }
                                    }, 1500);
                                    
                                }, 1000);
                            } else {
                                showMessage('register-message', 'warning', '数据文件创建失败，但用户已注册成功。请登录后手动同步。');
                                btn.innerHTML = original;
                                btn.disabled = false;
                            }
                        } catch (dataError) {
                            console.error('数据文件创建错误:', dataError);
                            showMessage('register-message', 'warning', '数据文件创建失败，但用户已注册成功。请登录后手动同步。');
                            btn.innerHTML = original;
                            btn.disabled = false;
                        }
                    }, 1000);
                    
                } else {
                    throw new Error('用户配置保存失败，请稍后重试');
                }
                
            } catch (error) {
                showMessage('register-message', 'error', error.message);
                console.error('注册失败:', error);
                btn.innerHTML = original;
                btn.disabled = false;
            }
        }
        
        // ========== API 函数 ==========
        
        // 使用Token检查用户账号是否存在 - 修复版本
        async function checkUserExistsWithToken(repo, username, password, token) {
            try {
                const [owner, repoName] = repo.split('/');
                const filePath = `data/users/${username}.json`;
                
                console.log('检查用户:', { owner, repoName, filePath });
                
                // 尝试获取用户配置
                const response = await fetch(`https://api.github.com/repos/${owner}/${repoName}/contents/${filePath}`, {
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                
                if (response.status === 404) {
                    return { exists: false, reason: 'not_found', error: '用户配置文件不存在' };
                }
                
                if (!response.ok) {
                    return { exists: false, reason: 'error', error: '无法访问用户数据: ' + response.status };
                }
                
                const data = await response.json();
                const content = JSON.parse(decodeURIComponent(atob(data.content)));
                
                // 验证密码
                const encryptedPassword = btoa(encodeURIComponent(password));
                if (content.password === encryptedPassword) {
                    return { exists: true };
                } else {
                    return { exists: false, reason: 'password', error: '密码不匹配' };
                }
                
            } catch (error) {
                console.error('验证用户失败:', error);
                return { exists: false, reason: 'error', error: error.message };
            }
        }
        
        // 获取用户配置
        async function getUserConfig(token, repo, username) {
            try {
                const [owner, repoName] = repo.split('/');
                const filePath = `data/users/${username}.json`;
                
                const response = await fetch(`https://api.github.com/repos/${owner}/${repoName}/contents/${filePath}`, {
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    const content = decodeURIComponent(atob(data.content));
                    return JSON.parse(content);
                } else if (response.status === 404) {
                    return null;
                }
                
                return null;
            } catch (error) {
                console.error('获取用户配置失败:', error);
                return null;
            }
        }
        
        // 验证GitHub Token
        async function validateGitHubToken(token, repo) {
            try {
                const [owner, repoName] = repo.split('/');
                const response = await fetch(`https://api.github.com/repos/${owner}/${repoName}`, {
                    headers: {
                        'Authorization': `token ${token}`,
                        'Accept': 'application/vnd.github.v3+json'
                    }
                });
                return response.ok;
            } catch (error) {
                console.error('验证Token失败:', error);
                return false;
            }
        }
        
        // 保存用户配置
        async function saveUserConfig(token, repo, username, config) {
            try {
                const [owner, repoName] = repo.split('/');
                const filePath = `data/users/${username}.json`;
                
                // 使用encodeURIComponent避免非Latin1字符问题
                const content = btoa(encodeURIComponent(JSON.stringify(config, null, 2)));
                
                // 检查文件是否存在
                let sha = null;
                try {
                    const checkResponse = await fetch(`https://api.github.com/repos/${owner}/${repoName}/contents/${filePath}`, {
                        headers: {
                            'Authorization': `token ${token}`,
                            'Accept': 'application/vnd.github.v3+json'
                        }
                    });
                    if (checkResponse.ok) {
                        const fileData = await checkResponse.json();
                        sha = fileData.sha;
                    }
                } catch (e) {
                    // 文件不存在，创建新文件
                }
                
                const body = {
                    message: `注册用户: ${username}`,
                    content: content,
                    sha: sha
                };
                
                console.log('保存用户配置:', { owner, repoName, filePath, body });
                
                const response = await fetch(`https://api.github.com/repos/${owner}/${repoName}/contents/${filePath}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify(body)
                });
                
                console.log('保存响应:', response.status, response.statusText);
                
                if (response.ok) {
                    const result = await response.json();
                    console.log('保存成功:', result);
                    return true;
                } else {
                    const error = await response.text();
                    console.error('保存失败:', error);
                    return false;
                }
                
            } catch (error) {
                console.error('保存用户配置失败:', error);
                return false;
            }
        }
        
        // 创建初始数据文件
        async function createInitialData(token, repo, username) {
            try {
                const [owner, repoName] = repo.split('/');
                const filePath = `data/${username}.json`;
                const initialData = {
                    records: [],
                    categories: {
                        '收入': ['工资', '奖金', '投资', '兼职', '其他收入'],
                        '支出': ['餐饮', '交通', '购物', '娱乐', '住房', '医疗', '教育', '其他支出'],
                        '借贷': ['借款', '还款']
                    },
                    budgets: {},
                    created: new Date().toISOString(),
                    lastSync: new Date().toISOString(),
                    version: 1
                };
                
                // 使用encodeURIComponent避免非Latin1字符问题
                const content = btoa(encodeURIComponent(JSON.stringify(initialData, null, 2)));
                
                const body = {
                    message: `创建初始数据: ${username}`,
                    content: content
                };
                
                console.log('创建初始数据:', { owner, repoName, filePath, body });
                
                const response = await fetch(`https://api.github.com/repos/${owner}/${repoName}/contents/${filePath}`, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify(body)
                });
                
                console.log('创建数据响应:', response.status, response.statusText);
                
                if (response.ok) {
                    const result = await response.json();
                    console.log('创建数据成功:', result);
                    return true;
                } else {
                    const error = await response.text();
                    console.error('创建数据失败:', error);
                    return false;
                }
                
            } catch (error) {
                console.error('创建初始数据失败:', error);
                throw error;
            }
        }
    </script>
